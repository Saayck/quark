quarkus.application.name=quark-bank
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.transaction-isolation-level=read-committed
quarkus.transaction-manager.default-transaction-timeout=10S
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true

quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=quark-bank-api
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.audience=quark-bank-api
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=deny
quarkus.http.limits.max-body-size=16K
quarkus.http.host=127.0.0.1
quarkus.jackson.fail-on-unknown-properties=true

%dev.quarkus.datasource.username=bank
%dev.quarkus.datasource.password=bank-local-only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:15432/bank
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.flyway.locations=db/migration,db/demo
%dev.quarkus.oidc.auth-server-url=http://127.0.0.1:8180/realms/quark-bank
%dev.quarkus.keycloak.devservices.enabled=false
%dev.quarkus.http.auth.permission.metrics.policy=permit

%test.quarkus.datasource.username=bank
%test.quarkus.datasource.password=bank-local-only
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:15432/bank_test
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.locations=db/migration
%test.quarkus.oidc.auth-server-url=http://127.0.0.1:8180/realms/quark-bank
%test.quarkus.oidc.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.http.auth.permission.metrics.policy=permit

mp.openapi.extensions.smallrye.info.title=Quark Bank API
mp.openapi.extensions.smallrye.info.version=0.1.0
