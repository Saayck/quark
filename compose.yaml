name: quark-bank
services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank-local-only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - bank-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./infra/keycloak/quark-bank-realm.json:/opt/keycloak/data/import/quark-bank-realm.json:ro
volumes:
  bank-data:
